    <header style="max-width:800px;margin:0 auto;padding:40px 20px;">
      <h1>AssetNode — IT Asset Management for Growing Teams</h1>
      <p style="font-size:1.2em;color:#555;margin-bottom:24px;">
        The modern platform for IT hardware management, employee assignments, and compliance reports.
        Start free — no credit card required.
      </p>
    </header>

    <main style="max-width:800px;margin:0 auto;padding:0 20px;">

      <section>
        <h2>Why AssetNode?</h2>
        <p>AssetNode is the IT asset management solution for growing teams.
          Manage laptops, desktops, smartphones, tablets, and accessories in one central platform.
          Assign hardware to employees, track the full device lifecycle, and
          generate compliance-ready audit reports — all in one tool.</p>
      </section>

      <section>
        <h2>Core Features</h2>
        <ul>
          <li><strong>Hardware Asset Tracking:</strong> Inventory all IT devices with serial numbers, categories,
            status, and warranty data.</li>
          <li><strong>Employee Assignments:</strong> Assign hardware to employees and keep track of
            all assigned devices.</li>
          <li><strong>MDM Device Sync:</strong> Automatic sync with Microsoft Intune, Windows Autopilot,
            Jamf Pro, Jamf School, Kandji, and Mosyle.</li>
          <li><strong>HR System Integration:</strong> Employee sync with Personio, BambooHR, HiBob, and Google
            Workspace.</li>
          <li><strong>SCIM 2.0 Provisioning:</strong> Automatic user management via Okta, Azure AD (Microsoft
            Entra ID), and OneLogin.</li>
          <li><strong>Audit &amp; Compliance:</strong> Generate ISO 27001-compliant reports with full
            asset history and audit trail.</li>
          <li><strong>REST API:</strong> Full programmatic access to all inventory data.</li>
          <li><strong>CSV Import/Export:</strong> Import existing inventory data from Excel or CSV files.</li>
          <li><strong>Lifecycle Automation:</strong> Automated workflows for procurement, maintenance, and retirement.</li>
        </ul>
      </section>

      <section>
        <h2>Integrations</h2>
        <h3>MDM Systems (Mobile Device Management)</h3>
        <ul>
          <li>Microsoft Intune — Automatically sync devices from Microsoft 365</li>
          <li>Windows Autopilot — Import Autopilot profiles and devices</li>
          <li>Jamf Pro — Sync macOS and iOS devices</li>
          <li>Jamf School — Manage school devices</li>
          <li>Kandji — Import Apple devices from Kandji blueprints</li>
          <li>Mosyle — Sync Mosyle Business devices</li>
        </ul>

        <h3>HR Systems (Human Resources)</h3>
        <ul>
          <li>Personio — Automatically sync employees from Personio</li>
          <li>BambooHR — Import employee data from BambooHR</li>
          <li>HiBob — Employee sync with HiBob HRIS</li>
          <li>Google Workspace — Sync users from Google Admin Directory</li>
        </ul>

        <h3>Identity &amp; Provisioning</h3>
        <ul>
          <li>SCIM 2.0 — Automatic user management (Okta, Azure AD, OneLogin)</li>
          <li>SSO — Single Sign-On via SAML/OIDC</li>
        </ul>
      </section>

      <section>
        <h2>Who is AssetNode for?</h2>
        <p>AssetNode is ideal for IT departments in growing companies (50–1,000 employees)
          that want to professionally manage their IT hardware. Especially suited for:</p>
        <ul>
          <li>IT administrators who need an overview of all devices</li>
          <li>Companies replacing Excel spreadsheets with a professional ITAM solution</li>
          <li>Organizations with compliance requirements (ISO 27001, GDPR)</li>
          <li>Teams using MDM systems like Intune or Jamf who need a central inventory view</li>
        </ul>
      </section>

      <section>
        <h2>Frequently Asked Questions (FAQ)</h2>
        <dl>
          <dt><strong>What does AssetNode cost?</strong></dt>
          <dd>AssetNode offers a free forever plan with 100 assets and 5 users. No credit card required. Paid plans start at €20/month.</dd>

          <dt><strong>Is AssetNode GDPR compliant?</strong></dt>
          <dd>Yes, all data is stored in Germany (EU). AssetNode provides full audit logs and GDPR-compliant data management.</dd>

          <dt><strong>What devices can I manage?</strong></dt>
          <dd>Laptops, desktops, smartphones, tablets, monitors, printers, servers, network devices, and other IT accessories.</dd>

          <dt><strong>Can I import my existing data?</strong></dt>
          <dd>Yes, AssetNode supports CSV import for hardware, employees, and assignments. Excel files can be exported as CSV and imported.</dd>

          <dt><strong>Is there an API?</strong></dt>
          <dd>Yes, AssetNode provides a full REST API for programmatic access to all inventory data.</dd>
        </dl>
      </section>
