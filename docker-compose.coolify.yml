
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3001}
      - MONGODB_URI=${MONGODB_URI:-mongodb://assetnode:changeme@mongodb-prod:27017/assetnode?authSource=admin}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-15m}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-7d}
      - APP_URL=${APP_URL:-https://app.asset-node.com}
      - BASE_DOMAIN=${BASE_DOMAIN:-asset-node.com}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://app.asset-node.com}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CHAINIQ_API_URL=http://chainiq:4000
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@asset-node.com}
    expose:
      - "3001"
    depends_on:
      mongodb-prod:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001/health" ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.assetnode-http.rule=Host(`app.asset-node.com`)"
      - "traefik.http.routers.assetnode-http.entrypoints=http"
      - "traefik.http.routers.assetnode-https.rule=Host(`app.asset-node.com`)"
      - "traefik.http.routers.assetnode-https.entrypoints=https"
      - "traefik.http.routers.assetnode-https.tls=true"
      - "traefik.http.routers.assetnode-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.assetnode-api-http.rule=Host(`api.asset-node.com`)"
      - "traefik.http.routers.assetnode-api-http.entrypoints=http"
      - "traefik.http.routers.assetnode-api-https.rule=Host(`api.asset-node.com`)"
      - "traefik.http.routers.assetnode-api-https.entrypoints=https"
      - "traefik.http.routers.assetnode-api-https.tls=true"
      - "traefik.http.routers.assetnode-api-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.assetnode.loadbalancer.server.port=3001"

  mongodb-prod:
    image: mongo:7
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-assetnode}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-changeme}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  chainiq:
    build:
      context: ./chainiq
      dockerfile: Dockerfile
    environment:
      - PORT=4000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_URL=${CHAINIQ_DATABASE_URL:-ecto://postgres:postgres@postgres-chainiq:5432/chainiq_prod}
      - SECRET_KEY_BASE=${CHAINIQ_SECRET_KEY_BASE}
      - MIX_ENV=prod
      - PHX_SERVER=true
    expose:
      - "4000"
    depends_on:
      postgres-chainiq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/api/health" ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  postgres-chainiq:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${CHAINIQ_DB_USER:-postgres}
      - POSTGRES_PASSWORD=${CHAINIQ_DB_PASS:-postgres}
      - POSTGRES_DB=${CHAINIQ_DB_NAME:-chainiq_prod}
    volumes:
      - pg-chainiq-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${CHAINIQ_DB_USER:-postgres} -d ${CHAINIQ_DB_NAME:-chainiq_prod}" ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

volumes:
  mongo-data:
    driver: local
  pg-chainiq-data:
    driver: local
